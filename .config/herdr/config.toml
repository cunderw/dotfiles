onboarding = false

# Philosophy: tmux muscle memory wins every collision. Where herdr's stock
# binding conflicted with a tmux one, herdr's native action was moved aside
# (noted inline). Run `herdr --default-config` to see everything unset here.

[theme]
name = "terminal"

auto_switch = false
[ui]
# tmux: set -g mouse on
mouse_capture = true
copy_on_select = true

show_agent_labels_on_pane_borders = true
agent_panel_sort = "spaces"
[session]
resume_agents_on_restore = true

[experimental]
pane_history = true

[keys]
prefix = "ctrl+b"
new_tab = "prefix+c"
new_workspace = ["prefix+shift+n", "prefix+shift+c"]
close_pane = "prefix+x"
close_tab = "prefix+shift+x"
copy_mode = "prefix+["
split_vertical = ["prefix+v", "prefix+%"]
split_horizontal = ["prefix+minus", 'prefix+"']
rename_pane = ["prefix+shift+p", "prefix+ctrl+,"]
rename_tab = ["prefix+shift+t", "prefix+,"]
rename_workspace = ["prefix+shift+w", "prefix+<"]
reload_config = "prefix+r"
help = "prefix+alt+slash"
detach = ["prefix+d", "prefix+q"]
goto = "prefix+g"
new_worktree = "prefix+ctrl+g"
close_workspace = "prefix+ctrl+d"
next_workspace = ["prefix+ctrl+n", "prefix+j"]
previous_workspace = ["prefix+ctrl+p", "prefix+k"]
next_agent = "prefix+ctrl+j"
previous_agent = "prefix+ctrl+k"
resize_mode = [
  "prefix+alt+r"
]

# --- Navigate mode (prefix+w) -----------------------------------------------
# Vim keys drive the *workspace* list; pane movement is unbound here so j/k
# never jump sideways into panes mid-list. Arrow keys kept alongside.
# NOTE: herdr's default config says the left/right arrows "always" focus panes,
# so that pair may be hardwired and survive being unset below.
navigate_workspace_up = ["up", "k"]
navigate_workspace_down = ["down", "j"]
navigate_pane_left = ""
navigate_pane_down = ""
navigate_pane_up = ""
navigate_pane_right = ""

# --- Pane focus -------------------------------------------------------------
# Pane navigation is ctrl+hjkl via herdr-splits (plugin bindings further down),
# which also crosses nvim splits — prefix+hjkl was pure duplication. The
# prefix+vim-key axis means "spaces" instead: prefix+j / prefix+k walk the space
# list (see next_workspace above).
#
# These MUST be set to "" explicitly. Deleting the lines does not unbind them,
# it reverts them to herdr's defaults, which are exactly prefix+h/j/k/l — so
# prefix+j ends up claimed by both focus_pane_down and next_workspace, and herdr
# picks a winner silently. Omission is not unbinding.
#
# Fallbacks if the plugin ever breaks: prefix+tab cycles panes, and the mouse.
focus_pane_left = ""
focus_pane_down = ""
focus_pane_up = ""
focus_pane_right = ""

# ============================================================================
# Custom commands
# ============================================================================

[[keys.command]]
key = "prefix+shift+g"
type = "popup"
command = "~/.config/herdr/scripts/in-pane-cwd.sh lazygit"
description = "lazygit"
width = "80%"
height = "80%"

# prefix+? shows a grouped cheatsheet instead of herdr's flat built-in list.
# Generated from herdr's defaults merged with this file, so it cannot drift.
# `keys-help.py --conflicts` reports chords claimed by two actions — run it
# after any binding change, since herdr does not warn about duplicates and a
# config-only grep cannot see default-vs-override collisions.
# Fuzzy-searchable: type a chord ("ctrl+g"), an action ("rename"), or a group
# ("space") to filter. --source-command rather than a pipe, since the popup has
# no stdin to inherit. The grouped, browsable version is the same script with no
# flag: `python3 ~/.config/herdr/scripts/keys-help.py`
[[keys.command]]
key = "prefix+?"
type = "popup"
command = "tv --source-command 'python3 ~/.config/herdr/scripts/keys-help.py --search' --no-preview --input-prompt 'key> ' --input-header 'herdr keybindings'"
description = "keybinding search"
width = "80%"
height = "70%"

[[keys.command]]
key = "prefix+shift+r"
type = "popup"
command = "~/.config/herdr/scripts/in-pane-cwd.sh ranger"
description = "ranger"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+shift+d"
type = "shell"
command = "~/.config/herdr/scripts/dev-layout.sh"
description = "dev layout (nvim | claude / shell)"

# ============================================================================
# Installed plugins
# ============================================================================

# termscope — scan the focused pane for visible file paths, open in a picker.
# Requires Television (tv), installed by the plugin's build step via Homebrew.
# The `open-links` action (same scan, for URLs) is deliberately left unbound.
[[keys.command]]
key = "prefix+ctrl+o"
type = "plugin_action"
command = "termscope.open"
description = "termscope: open visible file picker"

# ============================================================================
# herdr-splits.nvim — navigation + resizing across nvim splits and herdr panes
# ============================================================================

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "herdr-splits.nav-left"
description = "navigate left (nvim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "herdr-splits.nav-down"
description = "navigate down (nvim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "herdr-splits.nav-up"
description = "navigate up (nvim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "herdr-splits.nav-right"
description = "navigate right (nvim/herdr)"

[[keys.command]]
key = "alt+shift+h"
type = "plugin_action"
command = "herdr-splits.resize-left"
description = "resize left (nvim/herdr)"

[[keys.command]]
key = "alt+shift+j"
type = "plugin_action"
command = "herdr-splits.resize-down"
description = "resize down (nvim/herdr)"

[[keys.command]]
key = "alt+shift+k"
type = "plugin_action"
command = "herdr-splits.resize-up"
description = "resize up (nvim/herdr)"

[[keys.command]]
key = "alt+shift+l"
type = "plugin_action"
command = "herdr-splits.resize-right"
description = "resize right (nvim/herdr)"
